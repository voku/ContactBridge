<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>ContactBridge Capture</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-ring: rgb(37 99 235 / 18%);
      --background: #f5f7fb;
      --border: #cbd5e1;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --muted: #526073;
      --success: #0f9d58;
      --surface: #ffffff;
      --surface-muted: #eef2ff;
      --text: #0f172a;
      --shadow: 0 12px 24px rgb(15 23 42 / 8%);
      accent-color: var(--accent);
      font-family: system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #7aa2ff;
        --accent-hover: #9ab8ff;
        --accent-ring: rgb(122 162 255 / 24%);
        --background: #0f172a;
        --border: #334155;
        --danger: #ff8a80;
        --danger-bg: #3b1620;
        --muted: #94a3b8;
        --success: #4ade80;
        --surface: #111c33;
        --surface-muted: #16213d;
        --text: #e5eefc;
        --shadow: 0 18px 32px rgb(2 6 23 / 35%);
      }
    }

    body {
      background: var(--background);
      color: var(--text);
      margin: 0;
      min-block-size: 100svh;
      padding: 16px;
    }

    h1 {
      font-size: 1.125rem;
      font-weight: 700;
      margin: 0 0 16px;
      text-wrap: balance;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      padding: 16px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0 0 12px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      color: var(--text);
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .required-indicator {
      color: var(--danger);
      margin-left: 0.125rem;
    }

    input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      color: var(--text);
      font: inherit;
      inline-size: 100%;
      min-block-size: 2.75rem;
      padding: 0.75rem 0.875rem;
    }

    input::placeholder {
      color: var(--muted);
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent-ring);
      outline-offset: 2px;
    }

    input:user-invalid,
    input[aria-invalid="true"] {
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    .field-hint,
    .muted {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.45;
      margin: 0;
      text-wrap: pretty;
    }

    .field-error {
      align-items: flex-start;
      color: var(--danger);
      display: none;
      font-size: 0.875rem;
      gap: 0.375rem;
      line-height: 1.45;
      margin: 0;
    }

    input:user-invalid ~ .field-error,
    input[aria-invalid="true"] ~ .field-error {
      display: flex;
    }

    button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      inline-size: 100%;
      min-block-size: 2.75rem;
      padding: 0.75rem 1rem;
      transition: background 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .capture-disabled {
      opacity: 0.58;
    }

    .status {
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.45;
      margin-top: 12px;
      text-align: center;
      text-wrap: pretty;
    }

    .status[data-variant="success"] {
      color: var(--success);
    }

    .status[data-variant="error"] {
      color: var(--danger);
    }

    .data-row { margin-bottom: 8px; }
    .data-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .data-value { font-size: 0.875rem; font-weight: 500; }
  </style>
</head>
<body>
  <h1>ContactBridge</h1>
  
  <div class="card">
    <p class="card-title">Hub configuration</p>
    <form id="configForm" class="field">
      <label for="apiUrl">Hub URL<span class="required-indicator" aria-hidden="true">*</span></label>
      <input
        type="url"
        id="apiUrl"
        required
        inputmode="url"
        autocomplete="url"
        placeholder="http://localhost:3000"
        aria-describedby="apiUrlHelp"
        aria-errormessage="apiUrlError"
      />
      <p id="apiUrlHelp" class="field-hint">Use your local ContactBridge hub URL. The extension only accepts explicitly allowed origins.</p>
      <p id="apiUrlError" class="field-error" hidden><span aria-hidden="true">⚠</span><span id="apiUrlErrorText">Enter a valid ContactBridge hub URL.</span></p>
      <button id="saveConfigBtn" type="submit">Save URL</button>
    </form>
  </div>

  <div class="card capture-disabled" id="captureSection" aria-disabled="true">
    <div id="profileData" style="margin-bottom: 16px;">
      <p class="muted">Navigate to a supported profile or a visible LinkedIn people overview page to capture.</p>
    </div>
    <button id="captureBtn" disabled>Save this profile</button>
    <div id="status" class="status" aria-atomic="true" aria-live="polite" hidden></div>
  </div>

  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
